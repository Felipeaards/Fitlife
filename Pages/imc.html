        <section>
            <h3> Calculadora de IMC</h3>
            <p> Em breve você conseguirá usar a calculadora de IMC aqui!</p>
            <form action="">
                <label for ="peso"> Digite o seu peso (kg): </label>
                <input type="number" placeholder="Ex: 80" id="peso">
                
                <label for="altura"> Digite a sua altura (m): </label>
                <input type="number" placeholder="Ex: 1.80" id="altura">

                <button> Calcular</button>

            </form>
            
            <div>
                <p> Resultado do IMC: </p>
                <p> 00.00</p>
                <p> Classificação: </p>
            </div>
